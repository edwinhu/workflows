# THIS FILE IS THE ONE HOME. `scripts/prose-audit.py` loads it from here (DICTION_YAML) and nothing
# else loads a diction table. A byte-identical copy sits at ~/.claude/skills/ai-tic/linter/, in the
# dotfiles repo, with no emitter and no reader: nothing under ai-tic/ references diction.yaml at
# all. Unlike tics.yaml -> scored-tics-patterns.py, the two are not generator and output; they agree
# by luck and nothing would report it if they stopped. Edit here; the other copy is to be deleted.
#
# Diction dictionary — fancy AI word -> plain alternative, TIERED BY
# EMPIRICAL RATE in the combined law+finance+accounting corpus (14,294,148 sentences).
# Source mappings: github.com/conorbronsdon/avoid-ai-writing (their tiers were
# general-text vibes; re-tiered here against real scholarly prose).
#   always_flag = <2/M in BOTH genres -> safe to flag/replace on sight
#   cluster     = 2-20/M -> flag when 2+ appear in one paragraph
#   density     = 20-80/M -> flag only when saturated (~3%+ of words)
#   dropped     = >80/M -> legal/finance-NORMAL; do NOT flag (would FP)

meta: {corpus: combined_law_finance, sentences: 14294148, gate: rate_per_M}

always_flag:
  - {word: paradigm-shifting, replace_with: "(describe what actually shifted)", rate_per_M: 0.0}
  - {word: underpinning, replace_with: "basis, foundation, what supports", rate_per_M: 0.0}
  - {word: game-changer, replace_with: "describe what specifically changed and why it matters", rate_per_M: 0.1}
  - {word: nestled, replace_with: "is located, sits, is in", rate_per_M: 0.2}
  - {word: ever-evolving, replace_with: "changing, growing (or describe how)", rate_per_M: 0.4}
  - {word: bustling, replace_with: "busy, active (or cite what makes it busy)", rate_per_M: 0.6}
  - {word: learnings, replace_with: "lessons, findings, takeaways", rate_per_M: 0.6}
  - {word: showcasing, replace_with: "showing, demonstrating (or cut the clause)", rate_per_M: 0.8}
  - {word: reimagine, replace_with: "rethink, redesign, rebuild", rate_per_M: 1.0}
  - {word: tapestry, replace_with: "(describe the actual complexity)", rate_per_M: 1.1}
  - {word: symphony, replace_with: "(describe the actual coordination or combination)", rate_per_M: 1.5}
  - {word: world-class, replace_with: "Cite a benchmark or comparison", rate_per_M: 1.5}

