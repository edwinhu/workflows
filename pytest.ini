[pytest]
# norecursedirs REPLACES pytest's default, so the defaults are restated here.
# scratch/ is temp work by repo convention and holds vendored copies of other
# projects' tests.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} scratch

# Six files match pytest's naming but are standalone runnable checks that call
# sys.exit() at module scope. Importing one raises SystemExit during collection,
# which aborts the ENTIRE session — so a single unguarded script took the whole
# suite down. Run these directly. The real fix is an `if __name__ == "__main__":`
# guard in each; until then they are ignored by name, not by a wider pattern that
# would also drop the 29 genuine test files sharing their naming.
addopts =
    --ignore=skills/writing/scripts/writing_flip_test.py
    --ignore=skills/writing/scripts/writing_gate_probe_test.py
    --ignore=skills/writing/scripts/writing_receipt_test.py
    --ignore=tests/ownership_dq_test.py
    --ignore=tests/test_de_ai_footnote_masking.py
    --ignore=tests/test_law_review_footnote_symbols.py
